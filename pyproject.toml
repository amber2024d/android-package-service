[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "android-package-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "gunicorn>=23",
  "httpx>=0.28",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "python-multipart>=0.0.20",
  "gpapi>=0.4.4",
  # Must match the Playwright base image tag in Dockerfile.
  "playwright==1.60.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "respx>=0.21",
]
# 对象存储后端（阶段 22）：按 STORAGE_BACKEND 安装对应 extra；local/测试不需要。
# SDK 在 app/storage/{gcs,s3}.py 内懒加载，未装时不影响本地后端与单测（单测注入假 client）。
gcs = [
  "google-cloud-storage>=2.18",
]
s3 = [
  "boto3>=1.35",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.api" = ["*.html", "*.js"]
"app.admin" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
